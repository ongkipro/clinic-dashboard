# Staging stack for Coolify (DEL-3, DEC-034, OD-I10/I11): synthetic data only (MIG-2), DEPLOY_ENV=staging.
# Not the local-dev compose.yaml at the repository root (that one runs PostgreSQL with fsync=off).
#
# Coolify: Docker Compose build pack, base directory "/", compose file "/deploy/staging/compose.yaml".
# Paths resolve from the repository root (Coolify passes --project-directory); locally run
#   docker compose --project-directory . -f deploy/staging/compose.yaml ...
# Domains (Coolify > Domains, each on service "app", port 3000):
#   https://stg-app.klinikmu.com:3000, https://stg-vendor.klinikmu.com:3000, https://stg.klinikmu.id:3000
# Variables: see deploy/staging/README.md. Database passwords are generated by Coolify (SERVICE_PASSWORD_*);
# every other secret is set once in Coolify's environment panel.
#
# Order: postgres (healthy) -> migrate (runs migrations, creates the login roles, exits 0) -> app.
services:
  postgres:
    image: postgres:16.15-bookworm
    init: true
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: clinic_owner
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_OWNER}
      POSTGRES_DB: clinic_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinic_owner", "-d", "clinic_dashboard", "-t", "2"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256mb
    restart: unless-stopped

  # One-shot: migrations (owner role) then the four login roles the app connects with (deploy/staging/roles.sh).
  # The two scripts are baked into this image at build time (Coolify turns relative bind mounts into empty
  # directories): the app image plus deploy/staging/*.sh, through a named build context.
  migrate:
    build:
      context: .
      additional_contexts:
        app_image: service:app
        staging: ./deploy/staging
      dockerfile_inline: |
        FROM app_image
        COPY --from=staging --chmod=0555 roles.sh roles-entrypoint.sh /app/deploy/
    user: node
    working_dir: /app/migrate
    entrypoint: ["/bin/sh", "/app/deploy/roles-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://clinic_owner:${SERVICE_PASSWORD_OWNER}@postgres:5432/clinic_dashboard
      PGHOST: postgres
      PGUSER: clinic_owner
      PGPASSWORD: ${SERVICE_PASSWORD_OWNER}
      PGDATABASE: clinic_dashboard
      APP_DB_PASSWORD: ${SERVICE_PASSWORD_APPDB}
      AUTH_DB_PASSWORD: ${SERVICE_PASSWORD_AUTHDB}
      VENDOR_DB_PASSWORD: ${SERVICE_PASSWORD_VENDORDB}
      OPERATOR_DB_PASSWORD: ${SERVICE_PASSWORD_OPERATORDB}
      DEPLOY_ENV: staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Coolify: do not count this one-shot service in the application's health.
    labels:
      - coolify.exclude_from_hc=true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: node
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DEPLOY_ENV: staging
      APP_HOST: stg-app.klinikmu.com
      BOOKING_HOST: stg.klinikmu.id
      VENDOR_HOST: stg-vendor.klinikmu.com
      APP_URL: https://stg-app.klinikmu.com
      VENDOR_URL: https://stg-vendor.klinikmu.com
      # Every request reaches the app through Cloudflare and Traefik (OD-I9: all staging hosts proxied).
      TRUSTED_IP_HEADER: cf-connecting-ip
      APP_DATABASE_URL: postgres://clinic_app_login:${SERVICE_PASSWORD_APPDB}@postgres:5432/clinic_dashboard
      AUTH_DATABASE_URL: postgres://clinic_auth_login:${SERVICE_PASSWORD_AUTHDB}@postgres:5432/clinic_dashboard
      VENDOR_DATABASE_URL: postgres://clinic_vendor_login:${SERVICE_PASSWORD_VENDORDB}@postgres:5432/clinic_dashboard
      KEK_FILE: /run/secrets/kek
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      AFTERCARE_OTP_SECRET: ${SERVICE_BASE64_64_AFTERCARE}
      IMPORT_HMAC_SECRET: ${SERVICE_BASE64_64_IMPORT}
      PIXEL_CONSENT_SECRET: ${SERVICE_BASE64_64_PIXEL}
      PUBLIC_BOOKING_HMAC_SECRET: ${SERVICE_BASE64_64_BOOKING}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      APP_RELEASE_DIGEST: ${APP_RELEASE_DIGEST:-}
      RESIDENCY_DATABASE_PROVIDER: ${RESIDENCY_DATABASE_PROVIDER:-Biznet Gio}
      RESIDENCY_DATABASE_REGION: ${RESIDENCY_DATABASE_REGION:-Jakarta}
      RESIDENCY_DATABASE_COUNTRY: ${RESIDENCY_DATABASE_COUNTRY:-ID}
      RESIDENCY_OBJECT_STORAGE_PROVIDER: ${RESIDENCY_OBJECT_STORAGE_PROVIDER:-Biznet Gio}
      RESIDENCY_OBJECT_STORAGE_REGION: ${RESIDENCY_OBJECT_STORAGE_REGION:-Jakarta}
      RESIDENCY_OBJECT_STORAGE_COUNTRY: ${RESIDENCY_OBJECT_STORAGE_COUNTRY:-ID}
      RESIDENCY_BACKUPS_PROVIDER: ${RESIDENCY_BACKUPS_PROVIDER:-Biznet Gio}
      RESIDENCY_BACKUPS_REGION: ${RESIDENCY_BACKUPS_REGION:-Jakarta}
      RESIDENCY_BACKUPS_COUNTRY: ${RESIDENCY_BACKUPS_COUNTRY:-ID}
      RESIDENCY_LOGS_PROVIDER: ${RESIDENCY_LOGS_PROVIDER:-Biznet Gio}
      RESIDENCY_LOGS_REGION: ${RESIDENCY_LOGS_REGION:-Jakarta}
      RESIDENCY_LOGS_COUNTRY: ${RESIDENCY_LOGS_COUNTRY:-ID}
      RESIDENCY_ERROR_TRACKING_PROVIDER: ${RESIDENCY_ERROR_TRACKING_PROVIDER:-Biznet Gio}
      RESIDENCY_ERROR_TRACKING_REGION: ${RESIDENCY_ERROR_TRACKING_REGION:-Jakarta}
      RESIDENCY_ERROR_TRACKING_COUNTRY: ${RESIDENCY_ERROR_TRACKING_COUNTRY:-ID}
      NEXT_TELEMETRY_DISABLED: "1"
    # KEK custody (ARCH-7, H-06): a host file, owned by uid 1000 (the image's node user), mode 0400, mounted read-only.
    # Never a Coolify variable. Created once on the host: see README.md.
    volumes:
      - /data/klinikmu/staging/kek:/run/secrets/kek:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/masuk',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

volumes:
  pgdata:
