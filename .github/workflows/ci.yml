# CI (DEL-2): install, typecheck, lint (incl. tenant-literal rule), unit + integration
# tests against PostgreSQL 16, isolation gate, build, audit, traceability, and one
# image per run with its digest recorded.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main gets its own group, so no main
# run (and its digest record) is cancelled, running or pending.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_ci_only
          POSTGRES_DB: clinic_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_dashboard"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Superuser of the throwaway CI service: tests create databases and roles.
      TEST_DATABASE_URL: postgres://clinic:clinic_ci_only@127.0.0.1:5432/clinic_dashboard
      DATABASE_URL: postgres://clinic:clinic_ci_only@127.0.0.1:5432/clinic_dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      # `pnpm test` runs every suite, including tests/rls and tests/isolation.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm docs:check
      - run: pnpm docs:promotion
      - name: Build image and record digest
        run: |
          docker build -t "clinic-dashboard:${GITHUB_SHA}" .
          node scripts/record-digest.mjs "clinic-dashboard:${GITHUB_SHA}" image-digest.json
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.json
          if-no-files-found: error
